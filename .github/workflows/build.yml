name: Build Windy

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v4
      - name: Compile Windy
        shell: bash
        run: |
          set -euo pipefail
          app="build/Windy.app"
          rm -rf build Windy.zip
          mkdir -p "$app/Contents/MacOS"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>Windy</string>
              <key>CFBundleExecutable</key>
              <string>Windy</string>
              <key>CFBundleIdentifier</key>
              <string>app.windy.wallpaper</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Windy</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          xcrun clang -arch x86_64 -fobjc-arc -mmacosx-version-min=10.13 -framework Cocoa -framework WebKit -framework AVFoundation -framework QuartzCore -framework CoreGraphics Windy.m -o "$app/Contents/MacOS/Windy"
          /usr/bin/codesign --force --deep --sign - "$app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" Windy.zip
      - name: Upload Windy
        uses: actions/upload-artifact@v4
        with:
          name: Windy-macOS-10.13
          path: Windy.zip
          if-no-files-found: error
